AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Garmi Check - humidity-aware heat-stress API (wet-bulb vs thermometer)

Resources:
  GarmiApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      CorsConfiguration:
        AllowOrigins: ["*"]
        AllowMethods: [GET]

  HeatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: garmi-check-api
      Description: Wet-bulb heat risk from Open-Meteo hourly data
      CodeUri: backend/
      Handler: app.handler
      Runtime: python3.13
      Timeout: 10
      MemorySize: 256
      Policies:
        - Statement:
            - Effect: Allow
              Action: geo-places:ReverseGeocode
              Resource: !Sub "arn:${AWS::Partition}:geo-places:${AWS::Region}::provider/default"
      Events:
        Index:
          Type: HttpApi
          Properties:
            ApiId: !Ref GarmiApi
            Path: /
            Method: GET
        Risk:
          Type: HttpApi
          Properties:
            ApiId: !Ref GarmiApi
            Path: /risk
            Method: GET
        Replay:
          Type: HttpApi
          Properties:
            ApiId: !Ref GarmiApi
            Path: /replay
            Method: GET
        Place:
          Type: HttpApi
          Properties:
            ApiId: !Ref GarmiApi
            Path: /place
            Method: GET

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: garmi-check-alerts
      DisplayName: Garmi Check

  AlertFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: garmi-check-daily-alert
      Description: 6 AM IST daily check; emails high/extreme wet-bulb days per city via SNS
      CodeUri: backend/
      Handler: alerts.handler
      Runtime: python3.13
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          TOPIC_ARN: !Ref AlertTopic
          APP_URL: https://main.dvom9khnw26xr.amplifyapp.com
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt AlertTopic.TopicName
      Events:
        DailyAt6amIST:
          Type: Schedule
          Properties:
            Schedule: cron(30 0 * * ? *)
            Description: Garmi Check daily heat alert, 06:00 IST (00:30 UTC)

  AlertFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/garmi-check-daily-alert
      RetentionInDays: 14

  HeatFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/garmi-check-api
      RetentionInDays: 14

Outputs:
  ApiUrl:
    Description: Base URL for the Garmi Check API
    Value: !Sub "https://${GarmiApi}.execute-api.${AWS::Region}.amazonaws.com"
  AlertTopicArn:
    Description: SNS topic for daily heat alerts (subscribe an email to it)
    Value: !Ref AlertTopic
