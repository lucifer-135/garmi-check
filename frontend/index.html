<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Garmi Check</title>
  <meta name="description" content="Hour-by-hour heat check for outdoor workers in India: the thermometer reading next to the humidity-aware wet-bulb estimate.">
  <meta name="theme-color" content="#c2410c">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='14' fill='%23c2410c'/%3E%3Cg stroke='%23c2410c' stroke-width='5' stroke-linecap='round'%3E%3Cpath d='M32 4v8M32 52v8M4 32h8M52 32h8M12 12l6 6M46 46l6 6M12 52l6-6M46 18l6-6'/%3E%3C/g%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --bg: #faf6ef; --card: #ffffff; --ink: #1f1a14; --muted: #6b6257; --line: #e7dfd3;
      --brand: #c2410c;
      --lower: #1f6f5b; --lower-bg: #e1f1ea;
      --high: #a14a06; --high-bg: #fde9d0;
      --extreme: #a8231a; --extreme-bg: #fde0dc;
      --none: #8a8178; --none-bg: #efebe5;
      --radius: 14px;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", sans-serif;
    }
    main { max-width: 560px; margin: 0 auto; padding: 12px 16px 40px; }
    button, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 3px solid var(--brand); outline-offset: 2px; }

    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0 2px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.35rem; letter-spacing: -0.01em; }
    .brand svg { width: 28px; height: 28px; flex: none; }
    .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; background: var(--card); padding: 2px; }
    .lang button { border: 0; background: transparent; padding: 6px 12px; border-radius: 999px; font-size: 0.9rem; min-height: 36px; }
    .lang button[aria-pressed="true"] { background: var(--ink); color: #fff; }
    .tagline { color: var(--muted); margin: 4px 0 14px; font-size: 0.95rem; }

    .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
    .controls { display: grid; gap: 10px; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    label.small, .label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
    select {
      flex: 1 1 160px; min-height: 44px; padding: 8px 10px; border: 1px solid var(--line);
      border-radius: 10px; background: #fff;
    }
    .btn {
      min-height: 44px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--line);
      background: #fff; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
    }
    .btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .seg button { border: 0; background: #fff; padding: 8px 12px; min-height: 40px; }
    .seg button + button { border-left: 1px solid var(--line); }
    .seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
    [hidden] { display: none !important; }

    .status { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin: 14px 2px 8px; font-size: 0.85rem; color: var(--muted); }
    .linkbtn { border: 0; background: none; color: var(--brand); font-weight: 700; padding: 6px 0; min-height: 36px; }
    .place { font-weight: 800; font-size: 1.15rem; color: var(--ink); margin: 0; }

    .headline {
      border-radius: var(--radius); padding: 14px; display: flex; gap: 12px; align-items: center;
      border: 2px solid currentColor; margin-top: 8px;
    }
    .headline .glyph { font-size: 2rem; line-height: 1; width: 2.2rem; text-align: center; flex: none; }
    .headline strong { display: block; font-size: 1.2rem; line-height: 1.25; }
    .headline span { font-size: 0.9rem; color: var(--ink); }
    .b-lower { color: var(--lower); background: var(--lower-bg); }
    .b-high { color: var(--high); background: var(--high-bg); }
    .b-extreme { color: var(--extreme); background: var(--extreme-bg); }
    .b-none { color: var(--none); background: var(--none-bg); }

    .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; min-width: 0; }
    .card.body { border-width: 2px; border-color: currentColor; }
    .card .k { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); display: flex; gap: 6px; align-items: center; }
    .card .num { font-size: 2.1rem; font-weight: 800; line-height: 1.1; margin: 6px 0 2px; color: var(--ink); font-variant-numeric: tabular-nums; }
    .card .unit { font-size: 0.8rem; color: var(--muted); }
    .card .v { font-size: 0.88rem; margin-top: 8px; color: var(--ink); }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 8px; border-radius: 999px; font-weight: 800; font-size: 0.85rem; margin-top: 8px; }

    .note { border-radius: 12px; padding: 10px 12px; margin-top: 10px; font-size: 0.92rem; border: 1px dashed var(--line); background: #fff; }
    .note.gap { border: 2px solid var(--high); background: #fff7ed; font-weight: 600; }
    .note.dry { border: 2px solid var(--extreme); background: #fff5f4; }
    .avoid { display: flex; gap: 10px; align-items: flex-start; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-top: 10px; }
    .avoid .ic { font-size: 1.4rem; line-height: 1.2; }
    .avoid strong { display: block; }
    .avoid .ranges { font-size: 1.25rem; font-weight: 800; font-variant-numeric: tabular-nums; }

    h2 { font-size: 1rem; margin: 22px 2px 8px; }
    .tabs { display: flex; gap: 8px; margin-top: 10px; }
    .tabs button { flex: 1; min-height: 40px; border: 1px solid var(--line); background: #fff; border-radius: 10px; font-weight: 700; }
    .tabs button[aria-selected="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }

    .strip { display: flex; gap: 4px; overflow-x: auto; padding: 2px 2px 8px; scroll-snap-type: x proximity; }
    .hour {
      flex: 0 0 46px; scroll-snap-align: start; border-radius: 10px; text-align: center; padding: 6px 2px;
      border-top: 5px solid currentColor; font-variant-numeric: tabular-nums;
    }
    .hour .h { font-size: 0.75rem; color: var(--muted); }
    .hour .g { font-size: 0.8rem; line-height: 1.3; }
    .hour .w { font-weight: 800; font-size: 0.85rem; color: var(--ink); }
    .hour.past { opacity: 0.45; }
    .hour.now { outline: 2px solid var(--ink); outline-offset: -2px; }
    .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 0.8rem; color: var(--muted); margin: 2px; }
    .legend span b { font-weight: 800; }

    .share { text-decoration: none; width: 100%; justify-content: center; margin-top: 16px; background: #1b7f45; color: #fff; border-color: #1b7f45; font-size: 1.05rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chips button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 8px 12px; min-height: 40px; font-size: 0.9rem; text-align: left; }
    .chips button[aria-pressed="true"] { border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); background: #fff7ed; }
    .chips small { color: var(--muted); }

    .advice ul, .how ul { margin: 6px 0 0; padding-left: 20px; }
    .advice li, .how li { margin: 4px 0; }
    .src { font-size: 0.8rem; color: var(--muted); margin-top: 8px; }
    details.how summary { cursor: pointer; font-weight: 700; min-height: 36px; display: flex; align-items: center; }
    a { color: var(--brand); }
    .error { border: 2px solid var(--extreme); background: #fff5f4; border-radius: var(--radius); padding: 12px; margin-top: 10px; }
    .loading { color: var(--muted); padding: 24px 4px; text-align: center; }
    footer { margin-top: 26px; font-size: 0.82rem; color: var(--muted); text-align: center; }
    footer strong { color: var(--ink); }
    .aws { display: inline-block; margin-top: 6px; padding: 3px 8px; border-radius: 6px; background: #232f3e; color: #fff; font-weight: 600; }
  </style>
</head>
<body>
<main>
  <header>
    <div class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="13" fill="#c2410c"/><g stroke="#c2410c" stroke-width="5" stroke-linecap="round"><path d="M32 4v8M32 52v8M4 32h8M52 32h8M12 12l6 6M46 46l6 6M12 52l6-6M46 18l6-6"/></g></svg>
      <span data-i18n="appName">Garmi Check</span>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="hi" aria-pressed="false" lang="hi">हिं</button>
    </div>
  </header>
  <p class="tagline" data-i18n="tagline"></p>

  <section class="panel controls" aria-label="Place">
    <div>
      <label class="small" for="city" data-i18n="cityLabel"></label>
      <div class="row">
        <select id="city"></select>
        <button type="button" class="btn" id="locate">📍 <span data-i18n="useLocation"></span></button>
      </div>
    </div>
    <div id="regionRow" hidden>
      <div class="label" id="regionLabel" data-i18n="regionLabel"></div>
      <div class="seg" role="group" aria-labelledby="regionLabel">
        <button type="button" data-region="plains" data-i18n="plains"></button>
        <button type="button" data-region="coastal" data-i18n="coastal"></button>
        <button type="button" data-region="hills" data-i18n="hills"></button>
      </div>
    </div>
  </section>

  <div class="status">
    <span id="modeNote"></span>
    <button type="button" class="linkbtn" id="backLive" hidden data-i18n="backLive"></button>
  </div>

  <section id="result" aria-live="polite"></section>

  <h2 data-i18n="realDay"></h2>
  <div class="chips" id="realDays"></div>

  <section class="panel advice" style="margin-top:22px">
    <strong data-i18n="adviceTitle"></strong>
    <ul id="adviceList"></ul>
    <p style="margin:8px 0 0;font-weight:700" data-i18n="emergency"></p>
    <p class="src"><span data-i18n="adviceSrc"></span> <a href="https://ndma.gov.in/Natural-Hazards/Heat-Wave" target="_blank" rel="noopener">ndma.gov.in</a></p>
  </section>

  <details class="panel how" style="margin-top:12px">
    <summary data-i18n="howTitle"></summary>
    <ul id="howList"></ul>
    <p class="src">
      <a href="https://www.downtoearth.org.in/climate-change/indians-may-already-be-experiencing-temperatures-close-to-limits-of-human-survivability-without-even-being-aware-95278" target="_blank" rel="noopener">Down To Earth, 28 Mar 2024</a> ·
      <a href="https://doi.org/10.1175/JAMC-D-11-0143.1" target="_blank" rel="noopener">Stull 2011</a> ·
      <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
    </p>
  </details>

  <footer>
    <strong data-i18n="footer"></strong><br>
    <span data-i18n="footerData"></span> <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0) ·
    <a href="https://github.com/lucifer-135/garmi-check" target="_blank" rel="noopener">GitHub</a><br>
    <span class="aws">AWS Lambda · API Gateway · Amplify</span>
  </footer>
</main>
<script src="presets.js"></script>
<script src="app.js"></script>
</body>
</html>
