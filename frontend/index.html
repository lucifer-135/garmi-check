<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Garmi Check</title>
  <meta name="description" content="Hour-by-hour heat check for outdoor workers in India: the thermometer reading next to the humidity-aware wet-bulb estimate.">
  <meta name="theme-color" content="#FAF9F5">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ea580c' stroke-width='2.4' stroke-linecap='round'%3E%3Ccircle cx='12' cy='12' r='4'/%3E%3Cpath d='M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #FAF9F5;
      --s50: #f8fafc; --s100: #f1f5f9; --s200: #e2e8f0; --s300: #cbd5e1; --s400: #94a3b8;
      --s500: #64748b; --s600: #475569; --s700: #334155; --s800: #1e293b; --s900: #0f172a;
      --shadow-subtle: 0 1px 3px 0 rgba(0,0,0,.05), 0 1px 2px 0 rgba(0,0,0,.03);
      --shadow-card: 0 4px 12px -2px rgba(15,23,42,.05), 0 2px 6px -1px rgba(15,23,42,.03);
    }
    /* Band themes: lower = emerald, high = orange, extreme = red, none = slate */
    .t-lower { --c50:#ecfdf5; --c100:#d1fae5; --c200:#a7f3d0; --c400:#34d399; --c500:#10b981; --c600:#059669; --c700:#047857; --c800:#065f46; --c900:#064e3b; --c950:#022c22; --cx:#f0fdfa; }
    .t-high { --c50:#fff7ed; --c100:#ffedd5; --c200:#fed7aa; --c400:#fb923c; --c500:#f97316; --c600:#ea580c; --c700:#c2410c; --c800:#9a3412; --c900:#7c2d12; --c950:#431407; --cx:#fffbeb; }
    .t-extreme { --c50:#fef2f2; --c100:#fee2e2; --c200:#fecaca; --c400:#f87171; --c500:#ef4444; --c600:#dc2626; --c700:#b91c1c; --c800:#991b1b; --c900:#7f1d1d; --c950:#450a0a; --cx:#fff1f2; }
    .t-none { --c50:#f8fafc; --c100:#f1f5f9; --c200:#e2e8f0; --c400:#94a3b8; --c500:#64748b; --c600:#475569; --c700:#334155; --c800:#1e293b; --c900:#0f172a; --c950:#020617; --cx:#f8fafc; }

    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--s800); -webkit-font-smoothing: antialiased;
      font: 16px/1.5 "Plus Jakarta Sans", Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Devanagari", sans-serif;
    }
    ::selection { background: #ffedd5; color: #7c2d12; }
    button, select, a { font: inherit; color: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid #f59e0b; outline-offset: 2px; }
    [hidden] { display: none !important; }
    .wrap { max-width: 28rem; margin: 0 auto; padding: 16px 16px 48px; display: grid; gap: 16px; }
    .wrap > * { min-width: 0; }
    .card-w { background: #fff; border: 1px solid rgba(226,232,240,.8); border-radius: 16px; box-shadow: var(--shadow-subtle); }
    .up { text-transform: uppercase; letter-spacing: .05em; }

    /* Header */
    header { display: flex; align-items: center; justify-content: space-between; padding-top: 4px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand svg { width: 28px; height: 28px; color: #ea580c; flex: none; }
    .brand h1 { margin: 0; font-size: 20px; line-height: 1; font-weight: 700; letter-spacing: -0.025em; color: var(--s900); }
    .brand p { margin: 3px 0 0; font-size: 11px; font-weight: 600; letter-spacing: .025em; color: var(--s500); }
    .lang { display: inline-flex; padding: 2px; border-radius: 999px; background: rgba(226,232,240,.8); border: 1px solid rgba(203,213,225,.6); box-shadow: inset 0 2px 4px rgba(0,0,0,.05); }
    .lang button { border: 0; background: none; padding: 4px 12px; min-height: 30px; border-radius: 999px; font-size: 12px; font-weight: 600; color: var(--s600); }
    .lang button[aria-pressed="true"] { background: var(--s900); color: #fff; font-weight: 700; box-shadow: var(--shadow-subtle); }
    .tagline { margin: -4px 0 0; font-size: 12.5px; line-height: 1.6; font-weight: 500; color: var(--s600); }

    /* Location picker */
    .picker { padding: 14px; display: grid; gap: 12px; }
    .pick-row { display: flex; align-items: flex-end; gap: 8px; }
    .pick-row > div { flex: 1; min-width: 0; }
    .lbl { display: block; font-size: 10px; font-weight: 700; color: var(--s400); margin-bottom: 2px; }
    .sel { position: relative; }
    .sel select {
      width: 100%; appearance: none; -webkit-appearance: none; padding: 9px 32px 9px 12px; min-height: 42px;
      background: var(--s50); border: 1px solid var(--s200); border-radius: 12px; color: var(--s900); font-weight: 600; font-size: 14px;
    }
    .sel select:focus { outline: none; border-color: #f59e0b; box-shadow: 0 0 0 2px #f59e0b; }
    .sel svg { position: absolute; right: 12px; top: 50%; width: 16px; height: 16px; margin-top: -8px; color: var(--s400); pointer-events: none; }
    .locbtn {
      display: inline-flex; align-items: center; gap: 6px; padding: 10px 14px; min-height: 42px; border-radius: 12px;
      border: 1px solid var(--s200); background: #fff; color: var(--s700); font-weight: 600; font-size: 12px; white-space: nowrap;
      box-shadow: 0 1px 2px rgba(0,0,0,.05); transition: transform .1s, background .15s;
    }
    .locbtn:hover { background: var(--s50); }
    .locbtn:active { transform: scale(.95); }
    .locbtn svg { width: 14px; height: 14px; color: #f43f5e; }
    .region { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .region .lbl { margin: 0; }
    .seg { display: inline-flex; padding: 2px; gap: 2px; background: var(--s100); border-radius: 10px; }
    .seg button { border: 0; background: none; padding: 5px 10px; min-height: 30px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--s600); }
    .seg button[aria-pressed="true"] { background: #fff; color: var(--s900); box-shadow: var(--shadow-subtle); }
    .meta { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 10px; padding-top: 8px; border-top: 1px solid var(--s100); font-size: 11px; color: var(--s500); }
    .meta-l { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .meta-l b { font-weight: 600; color: var(--s700); }
    .meta-l i { font-style: normal; color: var(--s300); }
    .mdot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #10b981; }
    .mdot.live { animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; }
    .mdot.replay { background: #f59e0b; }
    .mdot.cited { background: var(--s400); }
    .meta-place { font-weight: 600; color: var(--s600); letter-spacing: -0.01em; }
    .linkbtn { border: 0; background: none; padding: 2px 0; font-size: 11px; font-weight: 700; color: #c2410c; }

    /* Day switcher */
    .days { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; background: rgba(226,232,240,.7); border-radius: 12px; }
    .days button, .days .one { border: 0; background: none; padding: 8px; min-height: 36px; border-radius: 8px; font-size: 12px; font-weight: 600; color: var(--s600); display: flex; align-items: center; justify-content: center; gap: 6px; }
    .days button[aria-selected="true"], .days .one { background: var(--s900); color: #fff; font-weight: 700; box-shadow: var(--shadow-subtle); }
    .days .one { grid-column: 1 / -1; }
    .days i { font-style: normal; font-weight: 400; color: var(--s400); }
    .days small { font-size: 12px; font-weight: 500; color: var(--s500); }
    .days [aria-selected="true"] small, .days .one small { color: var(--s200); }

    /* Hero risk card */
    .hero {
      position: relative; overflow: hidden; padding: 16px; border-radius: 16px; box-shadow: var(--shadow-card);
      background: linear-gradient(135deg, var(--c50), var(--cx)); border: 1px solid var(--c200);
    }
    .hero::after { content: ""; position: absolute; right: -16px; bottom: -16px; width: 112px; height: 112px; border-radius: 50%; background: var(--c100); opacity: .5; filter: blur(24px); pointer-events: none; }
    .hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
    .hero-title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; letter-spacing: -0.01em; color: var(--c900); line-height: 1.3; }
    .ping { position: relative; width: 12px; height: 12px; flex: none; }
    .ping::before, .ping::after { content: ""; position: absolute; inset: 0; border-radius: 50%; }
    .ping::before { background: var(--c400); opacity: .75; animation: ping 1s cubic-bezier(0,0,.2,1) infinite; }
    .ping::after { background: var(--c600); }
    .badge { flex: none; padding: 2px 8px; border-radius: 999px; font-size: 10px; font-weight: 800; white-space: nowrap; background: var(--c100); color: var(--c800); border: 1px solid var(--c200); }
    .hero p { position: relative; margin: 8px 0 0; font-size: 12px; line-height: 1.6; font-weight: 500; color: var(--c800); }
    .hero p strong { font-weight: 700; color: var(--c950); }

    /* Twin metric cards */
    .twin { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .metric { padding: 14px; display: flex; flex-direction: column; justify-content: space-between; min-width: 0; }
    .metric.body { border-color: var(--c200); box-shadow: var(--shadow-subtle), 0 0 0 1px var(--c100); }
    @supports (color: color-mix(in srgb, red 50%, transparent)) {
      .hero { background: linear-gradient(135deg, color-mix(in srgb, var(--c50) 90%, transparent), color-mix(in srgb, var(--cx) 50%, transparent)); border-color: color-mix(in srgb, var(--c200) 80%, transparent); }
      .metric.body { box-shadow: var(--shadow-subtle), 0 0 0 1px color-mix(in srgb, var(--c500) 20%, transparent); }
    }
    .mk { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: var(--s400); }
    .metric.body .mk { color: var(--c700); }
    .mv { margin-top: 8px; display: flex; align-items: baseline; }
    .mv b { font-size: 26px; font-weight: 800; letter-spacing: -0.025em; color: var(--s900); line-height: 1.15; font-variant-numeric: tabular-nums; }
    .mv span { margin-left: 2px; font-size: 16px; font-weight: 700; color: var(--s500); }
    .metric.body .mv b { color: var(--c700); }
    .metric.body .mv span { color: var(--c600); }
    .ms { display: block; font-size: 11px; font-weight: 600; color: var(--s500); }
    .mfoot { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--s100); }
    .mfoot p { margin: 0; font-size: 11px; line-height: 1.4; color: var(--s500); }
    .mfoot p b { font-weight: 600; color: var(--s700); }
    .gauge { position: relative; height: 6px; margin-top: 8px; border-radius: 999px; background: var(--s100); }
    .gauge > div { height: 100%; border-radius: 999px; background: #fbbf24; }
    .gauge > div.meets { background: #f97316; }
    .gauge > div.heatwave { background: #dc2626; }
    .gauge > s { position: absolute; top: -3px; bottom: -3px; width: 2px; border-radius: 1px; background: var(--s400); }
    .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; margin-bottom: 4px; border-radius: 6px; font-size: 10.5px; font-weight: 700; background: var(--c50); color: var(--c700); border: 1px solid var(--c200); }
    .chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c500); }

    /* Insight / note banners */
    .insight { padding: 12px; display: flex; align-items: flex-start; gap: 10px; }
    .ic { width: 28px; height: 28px; margin-top: 2px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; background: var(--s100); color: var(--s500); }
    .ic svg { width: 16px; height: 16px; }
    .insight .tt { margin: 0; font-size: 12.5px; font-weight: 600; line-height: 1.35; color: var(--s800); }
    .insight .ss { margin: 2px 0 0; font-size: 11.5px; line-height: 1.4; color: var(--s500); }
    .insight .rng { display: block; margin-top: 2px; font-size: 20px; font-weight: 800; letter-spacing: -0.02em; color: var(--c700); font-variant-numeric: tabular-nums; }
    .insight.risk { border-color: var(--c200); background: linear-gradient(135deg, #fff, var(--c50)); }
    .insight.risk .ic { background: var(--c100); color: var(--c600); }
    .note { padding: 12px; display: flex; gap: 10px; align-items: flex-start; border-radius: 16px; font-size: 12.5px; font-weight: 600; line-height: 1.45; background: var(--c50); color: var(--c900); border: 1px solid var(--c200); }
    .note .bang { width: 22px; height: 22px; flex: none; border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; color: #fff; background: var(--c500); }

    /* Hourly timeline */
    .hourly { display: grid; gap: 8px; }
    .sec-h { display: flex; align-items: center; justify-content: space-between; padding: 0 2px; }
    .sec-h h2, .sec-h h3 { margin: 0; font-size: 12px; font-weight: 700; color: var(--s800); }
    .sec-h span { font-size: 11px; font-weight: 500; color: var(--s400); }
    .strip { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 4px 16px 6px; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
    .strip::-webkit-scrollbar { display: none; }
    .tile { flex: 0 0 56px; height: 80px; padding: 8px 4px; border-radius: 12px; background: #fff; border: 1px solid rgba(226,232,240,.7); display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; }
    .tile .h { font-size: 11px; font-weight: 600; color: var(--s500); }
    .tile .w { font-size: 12px; font-weight: 700; color: var(--s800); font-variant-numeric: tabular-nums; }
    .tile.past { opacity: .55; }
    .tile.past .h { color: var(--s400); }
    .tile.t-high, .tile.t-extreme { background: var(--c50); border-color: var(--c200); }
    .tile.t-high .w, .tile.t-extreme .w { color: var(--c800); }
    .tile.now { flex-basis: 64px; background: var(--s900); border: 2px solid var(--s900); box-shadow: 0 4px 6px -1px rgba(0,0,0,.1), 0 2px 4px -2px rgba(0,0,0,.1); transform: translateY(-2px); }
    .tile.now .h { font-size: 10px; font-weight: 800; letter-spacing: .05em; color: var(--c400); }
    .tile.now .w { color: #fff; font-weight: 800; }
    .tile.now .mark { animation: pulse 2s cubic-bezier(.4,0,.6,1) infinite; background: var(--c400); }
    .mark { width: 7px; height: 7px; background: var(--c500); }
    .mark.lower, .tile.t-lower .mark, .tile.t-none .mark { border-radius: 50%; }
    .mark.high, .tile.t-high .mark { border-radius: 1px; transform: rotate(45deg); width: 7px; height: 7px; }
    .mark.extreme, .tile.t-extreme .mark { border-radius: 1px; width: 8px; height: 8px; background: var(--c600); }
    .tile.t-none .mark { background: var(--s300); }
    .legend { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px; padding-top: 4px; font-size: 11px; font-weight: 600; color: var(--s500); }
    .legend span { display: inline-flex; align-items: center; gap: 5px; }

    /* Share */
    .share {
      display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 14px 16px; border-radius: 16px;
      background: #1EA855; color: #fff; font-weight: 700; font-size: 14px; text-decoration: none;
      box-shadow: 0 4px 6px -1px rgba(6,78,59,.1), 0 2px 4px -2px rgba(6,78,59,.1); transition: background .15s;
    }
    .share:hover { background: #188F47; }
    .share:active { background: #157F3F; }
    .share svg { width: 20px; height: 20px; fill: currentColor; }

    /* Case studies */
    .cases { padding: 16px; display: grid; gap: 10px; }
    .cases .sec-h span { font-size: 10px; font-weight: 600; }
    .cases > p { margin: 0; font-size: 11.5px; line-height: 1.4; color: var(--s500); }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 4px; }
    .chips button { display: inline-flex; align-items: center; gap: 4px; padding: 6px 12px; min-height: 34px; border-radius: 999px; font-size: 12px; font-weight: 500; color: var(--s800); background: var(--s100); border: 1px solid rgba(226,232,240,.6); transition: background .15s; }
    .chips button:hover { background: var(--s200); }
    .chips button small { font-size: 10px; font-weight: 400; color: var(--s400); }
    .chips button[aria-pressed="true"] { background: #fff7ed; border-color: #fdba74; color: #7c2d12; }
    .chips button[aria-pressed="true"] small { color: #c2410c; }

    /* Health card */
    .health { padding: 16px; display: grid; gap: 12px; border-radius: 16px; box-shadow: var(--shadow-subtle);
      background: linear-gradient(135deg, rgba(255,251,235,.7), rgba(255,247,237,.4)); border: 1px solid rgba(253,230,138,.9); }
    .health-h { display: flex; align-items: center; gap: 8px; }
    .health-h div { width: 24px; height: 24px; flex: none; border-radius: 8px; background: #f59e0b; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; box-shadow: var(--shadow-subtle); }
    .health-h h3 { margin: 0; font-size: 14px; font-weight: 700; color: #451a03; }
    .health ul { margin: 0; padding: 0 0 0 4px; list-style: none; display: grid; gap: 8px; }
    .health li { display: flex; gap: 8px; font-size: 12px; font-weight: 500; line-height: 1.6; color: rgba(120,53,15,.9); }
    .health li::before { content: "•"; color: #f59e0b; font-weight: 700; }
    .health li b { font-weight: 700; }
    .sos { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,.9); border: 1px solid rgba(252,211,77,.7); }
    .sos small { display: block; font-size: 10px; font-weight: 700; color: var(--s400); }
    .sos span { font-size: 12px; font-weight: 700; color: var(--s900); }
    .sos span b { color: #e11d48; font-weight: 800; }
    .sos a { flex: none; padding: 8px 12px; border-radius: 8px; background: #e11d48; color: #fff; font-size: 12px; font-weight: 700; text-decoration: none; box-shadow: var(--shadow-subtle); }
    .sos a:hover { background: #be123c; }
    .src { margin: 0; font-size: 11px; color: rgba(146,64,14,.8); }
    .src a { font-weight: 600; color: inherit; text-decoration: underline; text-decoration-color: #fbbf24; }

    /* How it works */
    details.how { overflow: hidden; }
    details.how summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 16px; cursor: pointer; user-select: none; }
    details.how summary::-webkit-details-marker { display: none; }
    details.how summary > span { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; color: var(--s800); }
    details.how summary svg { width: 16px; height: 16px; color: var(--s500); flex: none; }
    details.how summary .chev { color: var(--s400); transition: transform .2s; }
    details.how[open] summary .chev { transform: rotate(180deg); }
    .how-body { padding: 4px 16px 16px; border-top: 1px solid var(--s100); display: grid; gap: 8px; font-size: 12px; line-height: 1.6; color: var(--s600); }
    .how-body p { margin: 0; }
    #howList { display: grid; gap: 8px; }
    .how-body .src { color: var(--s500); }
    .how-body .src a { text-decoration-color: var(--s300); }

    /* States */
    .loading { padding: 28px 16px; text-align: center; font-size: 13px; font-weight: 600; color: var(--s500); }
    .loading::before { content: ""; display: block; width: 10px; height: 10px; margin: 0 auto 10px; border-radius: 50%; background: #f97316; animation: pulse 1.2s ease-in-out infinite; }
    .error { padding: 14px; border-radius: 16px; background: #fef2f2; border: 1px solid #fecaca; color: #7f1d1d; font-size: 13px; }
    .error button { margin-top: 10px; padding: 8px 14px; border-radius: 10px; border: 1px solid #fecaca; background: #fff; font-weight: 700; font-size: 12px; }

    /* Footer */
    footer { text-align: center; padding: 16px 0 32px; display: grid; gap: 10px; justify-items: center; }
    footer .disc { margin: 0; font-size: 12px; font-weight: 700; color: var(--s700); }
    footer .data { margin: 0; font-size: 11px; color: var(--s500); }
    footer .data a { font-weight: 600; color: var(--s700); }
    .aws { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 2px 6px; padding: 4px 12px; border-radius: 999px; background: var(--s900); font-size: 10px; font-weight: 600; color: var(--s300); }
    .aws i { font-style: normal; color: var(--s600); }

    #result { display: grid; gap: 16px; }
    #result > * { min-width: 0; }

    @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
    @keyframes pulse { 50% { opacity: .5; } }
    @media (prefers-reduced-motion: reduce) { *, ::before, ::after { animation: none !important; transition: none !important; } }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">

      <div>
        <h1 data-i18n="appName">Garmi Check</h1>
        <p data-i18n="appSub"></p>
      </div>
    </div>
    <nav class="lang" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="hi" aria-pressed="false" lang="hi">हिंदी</button>
    </nav>
  </header>

  <p class="tagline" data-i18n="tagline"></p>

  <section class="card-w picker" aria-label="Place">
    <div class="pick-row">
      <div>
        <label class="lbl up" for="city" data-i18n="cityLabel"></label>
        <div class="sel">
          <select id="city"></select>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"/></svg>
        </div>
      </div>
      <button type="button" class="locbtn" id="locate">
        <svg viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" clip-rule="evenodd" d="M5.05 4.05a7 7 0 1 1 9.9 9.9L10 18.9l-4.95-4.95a7 7 0 0 1 0-9.9zM10 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
        <span data-i18n="useLocation"></span>
      </button>
    </div>
    <div class="region" id="regionRow" hidden>
      <span class="lbl up" id="regionLabel" data-i18n="regionLabel"></span>
      <div class="seg" role="group" aria-labelledby="regionLabel">
        <button type="button" data-region="plains" data-i18n="plains"></button>
        <button type="button" data-region="coastal" data-i18n="coastal"></button>
        <button type="button" data-region="hills" data-i18n="hills"></button>
      </div>
    </div>
    <div class="meta">
      <div class="meta-l"><span class="mdot" id="modeDot"></span><b id="modeNote"></b><i>•</i><span id="modeSrc"></span></div>
      <span class="meta-place" id="metaPlace"></span>
      <button type="button" class="linkbtn" id="backLive" hidden data-i18n="backLive"></button>
    </div>
  </section>

  <section id="result" aria-live="polite"></section>

  <section class="card-w cases">
    <div class="sec-h"><h3 class="up" data-i18n="realDay"></h3><span class="up" data-i18n="caseTag"></span></div>
    <p data-i18n="caseDesc"></p>
    <div class="chips" id="realDays"></div>
  </section>

  <section class="health">
    <div class="health-h"><div aria-hidden="true">!</div><h3 data-i18n="adviceTitle"></h3></div>
    <ul id="adviceList"></ul>
    <div class="sos">
      <div><small class="up" data-i18n="sosLabel"></small><span id="sosText"></span></div>
      <a href="tel:112" data-i18n="dial"></a>
    </div>
    <p class="src"><span data-i18n="sourceLabel"></span> <a href="https://ndma.gov.in/Natural-Hazards/Heat-Wave" target="_blank" rel="noopener" data-i18n="ndmaLink"></a></p>
  </section>

  <details class="card-w how">
    <summary>
      <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg><span data-i18n="howTitle"></span></span>
      <svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="M19 9l-7 7-7-7" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"/></svg>
    </summary>
    <div class="how-body">
      <div id="howList"></div>

        <a href="https://doi.org/10.1175/JAMC-D-11-0143.1" target="_blank" rel="noopener">Stull 2011</a> ·
        <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>
      </p>
    </div>
  </details>

  <footer>
    <p class="disc" data-i18n="footer"></p>
    <p class="data"><span data-i18n="footerData"></span> <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0) · <a href="https://github.com/lucifer-135/garmi-check" target="_blank" rel="noopener">GitHub</a></p>
    <div class="aws"><span>AWS Lambda</span><i>•</i><span>API Gateway</span><i>•</i><span>Amplify</span><i>•</i><span>Location</span><i>•</i><span>SNS</span></div>
  </footer>
</div>
